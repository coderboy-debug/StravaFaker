<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Routenplaner & Fake-Aktivität Generator</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        body { margin: 0; display: flex; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        #sidebar { width: 320px; padding: 20px; background: #f8f9fa; box-sizing: border-box; overflow-y: auto; box-shadow: 2px 0 5px rgba(0,0,0,0.1); z-index: 1000; }
        #map { flex-grow: 1; }
        h2 { margin-top: 0; font-size: 1.2rem; }
        label { font-size: 0.9rem; font-weight: bold; margin-top: 10px; display: block; }
        select, input, button { width: 100%; margin-top: 5px; margin-bottom: 15px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        button.danger { background: #dc3545; }
        button.danger:hover { background: #c82333; }
        .stats { background: #fff; padding: 15px; border-radius: 6px; border: 1px solid #ddd; margin-bottom: 15px; }
        .stat-value { font-size: 1.4rem; font-weight: bold; color: #333; }
        .help-text { font-size: 0.8rem; color: #666; margin-top: -10px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Routenplaner</h2>
        <p class="help-text">Klicke auf die Karte, um Wegpunkte zu setzen. Marker sind per Drag & Drop verschiebbar.</p>

        <label for="profile">Wegtyp:</label>
        <select id="profile" onchange="updateRoute()">
            <option value="cycling">Rennrad / MTB (Fahrrad)</option>
            <option value="foot">Wandern (Fußweg)</option>
        </select>

        <label for="speed">Ziel-Geschwindigkeit (km/h):</label>
        <input type="number" id="speed" value="25" min="1" max="100" oninput="updateStats()">

        <div class="stats">
            <label>Distanz:</label>
            <div class="stat-value"><span id="distance">0.00</span> km</div>
            
            <label>Geschätzte Dauer:</label>
            <div class="stat-value"><span id="duration">00:00:00</span></div>
            
            <p style="font-size: 0.7rem; color: #888; margin-top:10px;">Höhenmeter sind via OSRM Demo-API nicht verfügbar.</p>
        </div>

        <button onclick="exportActivity()">Als TCX exportieren (Strava)</button>
        <button class="danger" onclick="clearRoute()">Route löschen</button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        // Startkoordinaten: Zentriert auf Rosenheim
        const map = L.map('map').setView([47.8561, 12.1289], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let markers = [];
        let routeLayer = null;
        let routeCoordinates = []; // Für den TCX Export
        let totalDistanceKm = 0;

        // Klick-Event für die Karte
        map.on('click', function(e) {
            addMarker(e.latlng);
        });

        function addMarker(latlng) {
            const marker = L.marker(latlng, { draggable: true }).addTo(map);
            markers.push(marker);

            marker.on('dragend', function() {
                updateRoute();
            });

            updateRoute();
        }

        function clearRoute() {
            markers.forEach(marker => map.removeLayer(marker));
            markers = [];
            if (routeLayer) map.removeLayer(routeLayer);
            routeCoordinates = [];
            totalDistanceKm = 0;
            updateStats();
        }

        async function updateRoute() {
            if (markers.length < 2) {
                if (routeLayer) map.removeLayer(routeLayer);
                routeCoordinates = [];
                totalDistanceKm = 0;
                updateStats();
                return;
            }

            const profile = document.getElementById('profile').value;
            // OSRM erwartet Koordinaten im Format "lng,lat;lng,lat"
            const coordsString = markers.map(m => {
                const pos = m.getLatLng();
                return `${pos.lng},${pos.lat}`;
            }).join(';');

            const url = `https://router.project-osrm.org/route/v1/${profile}/${coordsString}?overview=full&geometries=geojson`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.code === 'Ok') {
                    if (routeLayer) map.removeLayer(routeLayer);

                    const geojson = data.routes[0].geometry;
                    routeCoordinates = geojson.coordinates; // Array von [lng, lat]
                    totalDistanceKm = data.routes[0].distance / 1000; // OSRM liefert Meter

                    // Route zeichnen
                    routeLayer = L.geoJSON(geojson, {
                        style: { color: '#ff4b4b', weight: 4, opacity: 0.8 }
                    }).addTo(map);

                    updateStats();
                }
            } catch (error) {
                console.error("Fehler beim Abrufen der Route:", error);
            }
        }

        function updateStats() {
            document.getElementById('distance').innerText = totalDistanceKm.toFixed(2);
            
            const speedKmh = parseFloat(document.getElementById('speed').value);
            if (!speedKmh || speedKmh <= 0 || totalDistanceKm === 0) {
                document.getElementById('duration').innerText = "00:00:00";
                return;
            }

            const durationHours = totalDistanceKm / speedKmh;
            const h = Math.floor(durationHours);
            const m = Math.floor((durationHours - h) * 60);
            const s = Math.floor((((durationHours - h) * 60) - m) * 60);

            document.getElementById('duration').innerText = 
                `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        // Haversine-Formel zur Distanzberechnung zwischen zwei Koordinaten
        function getDistanceFromLatLonInMeters(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // Erdradius in Metern
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function exportActivity() {
            if (routeCoordinates.length === 0) {
                alert("Bitte setze zuerst mindestens zwei Wegpunkte auf der Karte.");
                return;
            }

            const speedKmh = parseFloat(document.getElementById('speed').value);
            if (!speedKmh || speedKmh <= 0) {
                alert("Bitte eine gültige Geschwindigkeit eingeben.");
                return;
            }
            const speedMs = speedKmh / 3.6; 
            const profile = document.getElementById('profile').value;
            const sportType = profile === 'cycling' ? 'Biking' : 'Running'; // TCX Sport Types

            let startTime = new Date();
            let currentTime = new Date(startTime.getTime());
            let cumulativeDistance = 0;

            let tcxHeader = `<?xml version="1.0" encoding="UTF-8"?>
<TrainingCenterDatabase xmlns="http://www.garmin.com/xmlschemas/TrainingCenterDatabase/v2">
  <Activities>
    <Activity Sport="${sportType}">
      <Id>${startTime.toISOString()}</Id>
      <Lap StartTime="${startTime.toISOString()}">
        <Track>\n`;

            let tcxBody = "";

            for (let i = 0; i < routeCoordinates.length; i++) {
                const lng = routeCoordinates[i][0];
                const lat = routeCoordinates[i][1];

                if (i > 0) {
                    const prevLng = routeCoordinates[i-1][0];
                    const prevLat = routeCoordinates[i-1][1];
                    const dist = getDistanceFromLatLonInMeters(prevLat, prevLng, lat, lng);
                    
                    cumulativeDistance += dist;
                    // Zeit hinzufügen basierend auf exakter Distanz zwischen den Punkten
                    const timeToAddMs = (dist / speedMs) * 1000;
                    currentTime = new Date(currentTime.getTime() + timeToAddMs);
                }

                tcxBody += `          <Trackpoint>
            <Time>${currentTime.toISOString()}</Time>
            <Position>
              <LatitudeDegrees>${lat}</LatitudeDegrees>
              <LongitudeDegrees>${lng}</LongitudeDegrees>
            </Position>
            <DistanceMeters>${cumulativeDistance.toFixed(2)}</DistanceMeters>
          </Trackpoint>\n`;
            }

            let tcxFooter = `        </Track>
      </Lap>
    </Activity>
  </Activities>
</TrainingCenterDatabase>`;

            const tcxContent = tcxHeader + tcxBody + tcxFooter;
            
            // Download initiieren
            const blob = new Blob([tcxContent], { type: 'application/vnd.garmin.tcx+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `fake_activity_${startTime.toISOString().slice(0,10)}.tcx`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
